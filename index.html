<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch the Video</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#14171f;--muted:#5b6475;--accent:#2563eb;--accent-text:#fff;--border:#e3e6ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#171b25;--text:#eef1f7;--muted:#9aa3b5;--accent:#5b8cff;--accent-text:#0b1020;--border:#262c3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b25;--text:#eef1f7;--muted:#9aa3b5;--accent:#5b8cff;--accent-text:#0b1020;--border:#262c3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:760px}
h1{font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.2;margin:8px 0 6px}
p.sub{color:var(--muted);margin:0 0 20px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa3b5;text-align:center;padding:16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:18px}
.card h2{font-size:1.05rem;margin:0 0 6px}
.card p{margin:0;color:var(--muted)}
.btn{display:inline-block;margin-top:16px;background:var(--accent);color:var(--accent-text);text-decoration:none;font-weight:600;padding:12px 20px;border-radius:12px}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:28px}
</style>
</head>
<body>
<main>
  <h1 id="title">Your Video Title Here</h1>
  <p class="sub" id="sub">A short line about what viewers are about to watch.</p>

  <div class="player" id="player"></div>

  <div class="card">
    <h2>About this video</h2>
    <p id="desc">Add a short description here: what the video covers, who it is for, and anything viewers should know before pressing play.</p>
    <a class="btn" id="cta" href="#" style="display:none">Learn more</a>
  </div>

  <footer>Scanned from a QR code · Best viewed on your phone</footer>
</main>

<script>
// ===== EDIT THESE =====
var CONFIG = {
  title: "Mango's favorite food",
  subtitle: "A little walk in the forest.",
  description: "Add a short description here: what the video covers, who it is for, and anything viewers should know before pressing play.",
  // type: "youtube" | "vimeo" | "mp4" | "" (leave empty for placeholder)
  type: "",
  // youtube/vimeo: the video ID. mp4: full https URL to the file.
  source: "",
  ctaLabel: "",
  ctaUrl: ""
};
// ======================
(function(){
  document.getElementById("title").textContent = CONFIG.title;
  document.title = CONFIG.title;
  document.getElementById("sub").textContent = CONFIG.subtitle;
  document.getElementById("desc").textContent = CONFIG.description;
  var p = document.getElementById("player"), h = "";
  if (CONFIG.type === "youtube" && CONFIG.source)
    h = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(CONFIG.source) + '?rel=0&playsinline=1" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe>';
  else if (CONFIG.type === "vimeo" && CONFIG.source)
    h = '<iframe src="https://player.vimeo.com/video/' + encodeURIComponent(CONFIG.source) + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Video"></iframe>';
  else if (CONFIG.type === "mp4" && CONFIG.source)
    h = '<video controls playsinline preload="metadata" src="' + CONFIG.source.replace(/"/g, "&quot;") + '"></video>';
  else
    h = '<div class="empty">Your video will appear here</div>';
  p.innerHTML = h;
  if (CONFIG.ctaLabel && CONFIG.ctaUrl) {
    var a = document.getElementById("cta");
    a.textContent = CONFIG.ctaLabel; a.href = CONFIG.ctaUrl; a.style.display = "inline-block";
  }
})();
</script>
</body>
</html>
